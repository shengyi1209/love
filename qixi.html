<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>七夕 · 鹊桥相会</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Dancing+Script:wght@600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #050510;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    position: relative;
    font-family: 'Noto Serif SC', serif;
    background:
      radial-gradient(120% 80% at 50% 0%, #1a1638 0%, #0e0c24 45%, #050510 100%);
  }

  #sky {
    position: absolute; inset: 0;
    display: block;
  }

  /* Big title (appears at the very start) */
  #title {
    position: absolute;
    left: 50%; top: 34%;
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.4s ease, transform 1.4s ease;
  }
  #title.show { opacity: 1; }
  #title .cn {
    font-size: clamp(28px, 7vw, 46px);
    color: #ffe0ec;
    letter-spacing: 10px;
    font-weight: 600;
    text-shadow: 0 0 30px rgba(255,180,210,0.6);
    display: block;
    margin-bottom: 10px;
  }
  #title .en {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(18px, 4vw, 28px);
    color: #c9b8ff;
    letter-spacing: 2px;
    opacity: 0.8;
    display: block;
  }

  /* Bottom hint */
  #hint {
    position: absolute;
    left: 50%; bottom: 30px;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.35);
    font-size: 12px;
    letter-spacing: 3px;
    pointer-events: none;
    transition: opacity 1s ease;
    text-align: center;
    white-space: nowrap;
  }
</style>
</head>
<body>

<canvas id="sky"></canvas>

<div id="title">
  <span class="cn">七 夕 快 乐</span>
  <span class="en">给我的最爱</span>
</div>

<div id="hint">轻点绽放爱心 · 拖动旋转花束</div>

<script>
(function() {
  var canvas = document.getElementById('sky');
  var ctx = canvas.getContext('2d');
  var titleEl = document.getElementById('title');
  var hintEl = document.getElementById('hint');

  var W = 0, H = 0, DPR = 1;
  var isMobile = /Mobi|Android/i.test(navigator.userAgent) || window.innerWidth < 768;

  // ---------- Palette ----------
  // 银河：冷色（白 / 淡蓝 / 淡紫）
  var MILKY_COLORS = ['#ffffff', '#cfe0ff', '#d8c8ff', '#e8d8ff', '#a8c8ff', '#f0e8ff'];
  // 鹊桥：暖金（喜鹊 / 灯光）
  var BRIDGE_COLORS = ['#ffc98a', '#ffd7a8', '#ffe8c8', '#ffb877', '#ffdcb0'];
  // 文字 / 爱心：玫瑰粉
  var TEXT_COLORS = ['#ffb0c0', '#ff9eb5', '#ffd7e0', '#e8829a', '#ffc4d0', '#ffffff'];
  var HEART_COLORS = ['#ffb0c0', '#ff9eb5', '#e8829a', '#ffc4d0', '#ffd7e0'];
  var NAME_COLORS = ['#ffffff', '#fff2f0', '#ffe6c8', '#ffd9a8', '#fff5e0'];
  var ROSE_COLORS = ['#ff4d6d', '#ff3355', '#e8113f', '#ff6b81', '#c9184a', '#ffb3c1'];
  var LEAF_COLORS = ['#2d6a4f', '#40916c', '#52b788', '#1b4332', '#74c69d'];

  function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }

  // ---------- Particle set ----------
  var MORPH_COUNT = isMobile ? 1500 : 3400;
  var BRIDGE_COUNT = 170;
  var morphParticles = [];
  var bridgeParticles = [];

  function makeMorphParticle() {
    return {
      x: Math.random() * W, y: Math.random() * H,
      tx: Math.random() * W, ty: Math.random() * H,
      size: Math.random() * 1.7 + 0.7,
      color: pick(MILKY_COLORS),
      phase: Math.random() * Math.PI * 2,
      twinkle: Math.random() * 0.002 + 0.001,
      baseAlpha: Math.random() * 0.5 + 0.5,
      threeD: false, hx: 0, hy: 0, hz: 0,
      depthScale: 1, depthAlpha: 1,
    };
  }

  // ---------- Resize ----------
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    updateStarPositions();
  }

  // ---------- Two stars (牛郎 · 织女) ----------
  var star1 = { x: 0, y: 0, intensity: 0 }; // 织女（左）
  var star2 = { x: 0, y: 0, intensity: 0 }; // 牛郎（右）
  function updateStarPositions() {
    star1.x = W * 0.28;
    star1.y = H * 0.40;
    star2.x = W * 0.72;
    star2.y = H * 0.60;
  }
  // 鹊桥（二次贝塞尔曲线）
  function bridgePoint(t) {
    var cx = (star1.x + star2.x) / 2;
    var cy = Math.min(star1.y, star2.y) - H * 0.34; // 拱形控制点
    var x = (1-t)*(1-t)*star1.x + 2*(1-t)*t*cx + t*t*star2.x;
    var y = (1-t)*(1-t)*star1.y + 2*(1-t)*t*cy + t*t*star2.y;
    return { x: x, y: y };
  }
  function makeBridgeParticle() {
    var p = {
      t: Math.random(),
      speed: 0.0015 + Math.random() * 0.0028,
      size: Math.random() * 1.6 + 1.0,
      color: pick(BRIDGE_COLORS),
    };
    var bp = bridgePoint(p.t);
    p.x = bp.x; p.y = bp.y;
    return p;
  }

  // ---------- Intensity (smoothed) ----------
  var starIntensity = 0, targetStarIntensity = 0.5;   // 双星常亮
  var bridgeIntensity = 0, targetBridgeIntensity = 0.3; // 鹊桥常流
  var wobbleAmp = 0.25;
  var heartRotation = 0;   // 拖拽旋转角度（仅花束）
  var heartPulse = 0;      // 心跳脉冲（爱心 + 光晕共用）

  // 心跳：模拟 lub-dub 双拍
  function heartbeat(time) {
    var cycle = 1200;
    var ph = (time % cycle) / cycle;
    if (ph < 0.12) return Math.sin(ph / 0.12 * Math.PI);
    if (ph < 0.28) return Math.sin((ph - 0.12) / 0.16 * Math.PI) * 0.65;
    return 0;
  }
  // 玫瑰花瓣颜色：花心深红 → 边缘浅粉
  function roseColor(t) {
    var hue = 345;
    var sat = 88 + 12 * (1 - t);
    var light = 34 + 42 * t;
    return 'hsl(' + hue + ',' + sat + '%,' + light + '%)';
  }

  // ---------- Text sampling ----------
  var textCache = {};
  function sampleText(text) {
    if (textCache[text]) return textCache[text];
    var fontSize = 200;
    var c = document.createElement('canvas');
    var tctx = c.getContext('2d');
    var font = '700 ' + fontSize + 'px "Noto Serif SC","Microsoft YaHei",sans-serif';
    tctx.font = font;
    var tw = Math.ceil(tctx.measureText(text).width);
    c.width = Math.max(tw, 10);
    c.height = Math.ceil(fontSize * 1.6);
    tctx.font = font;
    tctx.fillStyle = '#fff';
    tctx.textAlign = 'left';
    tctx.textBaseline = 'top';
    tctx.fillText(text, 0, fontSize * 0.12);
    var data = tctx.getImageData(0, 0, c.width, c.height).data;
    var pts = [];
    var gap = 3;
    for (var y = 0; y < c.height; y += gap) {
      for (var x = 0; x < c.width; x += gap) {
        if (data[(y * c.width + x) * 4 + 3] > 128) {
          pts.push({ nx: x / c.width, ny: y / c.height });
        }
      }
    }
    textCache[text] = { pts: pts, aspect: c.width / c.height };
    return textCache[text];
  }

  function mapTextPoints(sampled) {
    var targetW = W * 0.82;
    var targetH = targetW / sampled.aspect;
    var ox = (W - targetW) / 2;
    var oy = (H - targetH) / 2;
    return sampled.pts.map(function(p) {
      return { x: ox + p.nx * targetW, y: oy + p.ny * targetH };
    });
  }

  // ---------- Shape target generators ----------
  function milkywayTarget() {
    var t = Math.random();
    var cx = t * W;
    var cy = H * 0.5 + (t - 0.5) * H * 0.34;
    var spread = H * 0.16;
    var offset = (Math.random() + Math.random() - 1) * spread;
    return { x: cx + (Math.random() - 0.5) * W * 0.08, y: cy + offset };
  }
  function heartTarget() {
    var t = Math.random() * Math.PI * 2;
    var x = 16 * Math.pow(Math.sin(t), 3);
    var y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
    var scale = Math.min(W, H) * 0.020;
    return { x: W/2 + x * scale, y: H/2 - y * scale * 0.92 };
  }

  // ---------- Scene application ----------
  function assignMilkyway() {
    for (var i = 0; i < morphParticles.length; i++) {
      var p = morphParticles[i];
      var t = milkywayTarget();
      p.tx = t.x; p.ty = t.y;
      p.threeD = false; p.depthScale = 1; p.depthAlpha = 1;
      p.color = pick(MILKY_COLORS);
      p.baseAlpha = Math.random() * 0.5 + 0.5;
    }
  }
  function assignText(text) {
    var mapped = mapTextPoints(sampleText(text));
    if (!mapped.length) { assignMilkyway(); return; }
    var n = morphParticles.length;
    var m = mapped.length;
    for (var i = 0; i < n; i++) {
      // 均匀覆盖整个字形（之前只取了顶部一部分，导致字模糊）
      var idx = Math.min(Math.floor(i * m / n), m - 1);
      var pt = mapped[idx];
      var p = morphParticles[i];
      p.tx = pt.x + (Math.random() - 0.5) * 1.2;
      p.ty = pt.y + (Math.random() - 0.5) * 1.2;
      p.threeD = false; p.depthScale = 1; p.depthAlpha = 1;
      p.color = pick(TEXT_COLORS);
      p.baseAlpha = Math.random() * 0.4 + 0.6;
      p.size = Math.random() * 2.0 + 1.2;
    }
  }
  function assignHeart() {
    for (var i = 0; i < morphParticles.length; i++) {
      var p = morphParticles[i];
      var t = heartTarget();
      p.tx = t.x; p.ty = t.y;
      p.color = pick(HEART_COLORS);
      p.baseAlpha = Math.random() * 0.5 + 0.5;
    }
  }

  // ---------- 爱心场景：粒子退为柔和背景光晕（矢量爱心为主） ----------
  function assignHeart3D() {
    for (var i = 0; i < morphParticles.length; i++) {
      var p = morphParticles[i];
      var t = milkywayTarget();
      p.tx = t.x; p.ty = t.y;
      p.threeD = false; p.depthScale = 1; p.depthAlpha = 1;
      p.color = pick(HEART_COLORS);
      p.baseAlpha = Math.random() * 0.3 + 0.2;
    }
  }

  // ---------- 花束场景：粒子退为柔和背景光晕（矢量花束为主） ----------
  function assignRose3D() {
    for (var i = 0; i < morphParticles.length; i++) {
      var p = morphParticles[i];
      var t = milkywayTarget();
      p.tx = t.x; p.ty = t.y;
      p.threeD = false; p.depthScale = 1; p.depthAlpha = 1;
      p.color = Math.random() < 0.6 ? pick(ROSE_COLORS) : pick(BRIDGE_COLORS);
      p.baseAlpha = Math.random() * 0.3 + 0.2;
    }
  }

  // ---------- Scenes ----------
  var scenes = [
    { type: 'milkyway', dur: 3000 },
    { type: 'text', text: '戴雪静',   dur: 5000 },
    { type: 'text', text: '我爱你',   dur: 5000 },
    { type: 'text', text: '七夕快乐', dur: 5000 },
    { type: 'text', text: '爱你永远', dur: 5000 },
    { type: 'heart',    dur: 8000 },
    { type: 'rose',     dur: 9000 },
  ];
  var sceneIdx = 0;
  var sceneTimer = null;

  function applyScene(scene) {
    if (scene.type === 'text') {
      assignText(scene.text);
      wobbleAmp = 0.04;   // 文字状态几乎不晃动，保证清晰
    } else if (scene.type === 'heart') {
      assignHeart3D();
      wobbleAmp = 0.03;
    } else if (scene.type === 'rose') {
      assignRose3D();
      wobbleAmp = 0.03;
    } else {
      assignMilkyway();
      wobbleAmp = 0.25;
    }
  }

  function transitionTo(scene) {
    // 先散开，再汇聚 —— 让形变更自然
    for (var i = 0; i < morphParticles.length; i++) {
      morphParticles[i].tx = Math.random() * W;
      morphParticles[i].ty = Math.random() * H;
      morphParticles[i].threeD = false;
      morphParticles[i].depthScale = 1;
      morphParticles[i].depthAlpha = 1;
    }
    setTimeout(function() { applyScene(scene); }, 700);
  }

  function nextScene() {
    sceneIdx = (sceneIdx + 1) % scenes.length;
    transitionTo(scenes[sceneIdx]);
    scheduleNext();
  }
  function scheduleNext() {
    if (sceneTimer) clearTimeout(sceneTimer);
    sceneTimer = setTimeout(nextScene, scenes[sceneIdx].dur);
  }

  // ---------- Interaction (spawn sparkles) ----------
  var sparks = [];
  function spawnSpark(x, y) {
    var n = isMobile ? 14 : 22;
    for (var i = 0; i < n; i++) {
      var ang = Math.random() * Math.PI * 2;
      var spd = Math.random() * 2.5 + 0.6;
      sparks.push({
        x: x, y: y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        life: 1,
        decay: Math.random() * 0.02 + 0.012,
        size: Math.random() * 1.8 + 0.8,
        color: pick(TEXT_COLORS),
      });
    }
  }
  // ---------- Floating hearts (tap) ----------
  var floatHearts = [];
  function spawnHearts(x, y) {
    var n = isMobile ? 4 : 7;
    for (var i = 0; i < n; i++) {
      floatHearts.push({
        x: x + (Math.random() - 0.5) * 34,
        y: y + (Math.random() - 0.5) * 22,
        vy: -(Math.random() * 1.3 + 0.55),
        vx: (Math.random() - 0.5) * 0.9,
        size: Math.random() * 9 + 6,
        rot: (Math.random() - 0.5) * 0.7,
        rotSpeed: (Math.random() - 0.5) * 0.03,
        life: 1,
        decay: Math.random() * 0.007 + 0.004,
        color: pick(HEART_COLORS),
      });
    }
  }

  // ---------- Interaction (tap = love burst, drag = spin) ----------
  var dragStartX = 0, dragging = false, moved = false, lastDragX = 0;
  function getXY(e) {
    if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }
  function onDown(e) {
    var p = getXY(e);
    dragStartX = p.x; lastDragX = p.x;
    dragging = true; moved = false;
  }
  function onMove(e) {
    if (!dragging) return;
    var p = getXY(e);
    var dx = p.x - lastDragX;
    lastDragX = p.x;
    if (Math.abs(p.x - dragStartX) > 12) moved = true;
    if (moved && scenes[sceneIdx].type === 'rose') {
      heartRotation += dx * 0.012;
    }
  }
  function onUp(e) {
    if (!dragging) return;
    dragging = false;
    if (!moved) {
      var p = getXY(e);
      spawnSpark(p.x, p.y);
      spawnHearts(p.x, p.y);
      spawnFirework(p.x, p.y);
      hintEl.style.opacity = '0';
    }
  }
  canvas.addEventListener('pointerdown', onDown, { passive: true });
  canvas.addEventListener('pointermove', onMove, { passive: true });
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  // ---------- Rose petals (falling) ----------
  var PETAL_COLORS = ['#ffb0c0', '#ff9eb5', '#e8829a', '#ffc4d0', '#ffd7e0', '#f7a8b8'];
  var petals = [];
  function spawnPetal() {
    if (petals.length > 45) return;
    petals.push({
      x: Math.random() * W,
      y: -24,
      vy: Math.random() * 0.55 + 0.35,
      vx: (Math.random() - 0.5) * 0.35,
      size: Math.random() * 4.5 + 3,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.025,
      sway: Math.random() * Math.PI * 2,
      alpha: Math.random() * 0.45 + 0.3,
      color: pick(PETAL_COLORS),
    });
  }
  for (var _i = 0; _i < 12; _i++) spawnPetal();
  setInterval(spawnPetal, 520);
  setInterval(spawnShootingStar, 2600);
  setInterval(spawnFirework, 3400);

  // ---------- Aurora (drifting colour blobs) ----------
  var aurora = [];
  for (var _a = 0; _a < 4; _a++) {
    aurora.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.max(W, H) * (0.4 + Math.random() * 0.4),
      dx: (Math.random() - 0.5) * 0.14,
      dy: (Math.random() - 0.5) * 0.09,
      hue: pick([168, 200, 258, 298]),
      phase: Math.random() * Math.PI * 2,
    });
  }
  function drawAurora(time) {
    for (var i = 0; i < aurora.length; i++) {
      var au = aurora[i];
      au.x += au.dx;
      au.y += au.dy;
      if (au.x < -au.r) au.x = W + au.r; else if (au.x > W + au.r) au.x = -au.r;
      if (au.y < -au.r) au.y = H + au.r; else if (au.y > H + au.r) au.y = -au.r;
      var r = au.r * (1 + Math.sin(time * 0.0003 + au.phase) * 0.12);
      var g = ctx.createRadialGradient(au.x, au.y, 0, au.x, au.y, r);
      var c = 'hsla(' + au.hue + ', 72%, 62%, ';
      g.addColorStop(0, c + '0.10)');
      g.addColorStop(0.5, c + '0.05)');
      g.addColorStop(1, c + '0)');
      ctx.fillStyle = g;
      ctx.fillRect(au.x - r, au.y - r, r * 2, r * 2);
    }
  }

  // ---------- Shooting stars ----------
  var shootingStars = [];
  function spawnShootingStar() {
    var x = Math.random() * W * 0.6 + W * 0.2;
    var y = Math.random() * H * 0.32;
    var ang = Math.PI * 0.42 + (Math.random() - 0.5) * 0.25;
    var dir = Math.random() < 0.5 ? 1 : -1;
    var speed = 8 + Math.random() * 6;
    shootingStars.push({
      x: x, y: y,
      vx: Math.cos(ang) * speed * dir,
      vy: Math.sin(ang) * speed,
      life: 1,
      decay: 0.016 + Math.random() * 0.012,
      len: 16 + Math.random() * 14,
    });
  }

  // ---------- Fireworks ----------
  var fireworks = [];
  function spawnFirework(x, y) {
    if (x == null) x = W * (0.18 + Math.random() * 0.64);
    if (y == null) y = H * (0.14 + Math.random() * 0.3);
    var count = isMobile ? 42 : 74;
    var hue = pick([340, 352, 300, 262, 205]);
    var parts = [];
    for (var i = 0; i < count; i++) {
      var ang = Math.random() * Math.PI * 2;
      var spd = Math.random() * 3.1 + 0.5;
      parts.push({
        x: x, y: y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        life: 1,
        decay: Math.random() * 0.012 + 0.008,
        hue: hue + (Math.random() - 0.5) * 22,
      });
    }
    fireworks.push({ parts: parts });
  }

  // ---------- Vector heart & rose (精致矢量绘制) ----------
  var sceneAlpha = 0;
  var targetSceneAlpha = 0;

  function heartPath(ctx, size) {
    ctx.beginPath();
    var N = 160;
    for (var i = 0; i <= N; i++) {
      var t = (i / N) * Math.PI * 2;
      var hx = 16 * Math.pow(Math.sin(t), 3);
      var hy = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
      var px = hx * size;
      var py = -hy * size * 0.92;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  function drawVectorHeart(time, alpha) {
    var beat = heartbeat(time);
    var size = Math.min(W, H) * 0.024 * (1 + beat * 0.09);
    var cx = W / 2, cy = H / 2;

    // 外发光（additive，真正亮起来）
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var gr = Math.min(W, H) * 0.5;
    var glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, gr);
    glow.addColorStop(0, 'rgba(255,80,140,' + (0.30 + 0.25 * beat) + ')');
    glow.addColorStop(0.55, 'rgba(255,50,110,0.10)');
    glow.addColorStop(1, 'rgba(255,50,110,0)');
    ctx.fillStyle = glow;
    ctx.globalAlpha = alpha;
    ctx.fillRect(cx - gr, cy - gr, gr * 2, gr * 2);
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(cx, cy);

    // 主体：对角光源渐变（左上亮 → 右下暗，立体感）
    heartPath(ctx, size);
    var g = ctx.createLinearGradient(-size * 15, -size * 15, size * 15, size * 15);
    g.addColorStop(0, '#ffb3c9');
    g.addColorStop(0.35, '#ff4d88');
    g.addColorStop(0.65, '#e0155c');
    g.addColorStop(1, '#6e0429');
    ctx.fillStyle = g;
    ctx.fill();

    // 发光描边
    ctx.shadowColor = 'rgba(255,80,150,0.95)';
    ctx.shadowBlur = 22;
    ctx.strokeStyle = 'rgba(255,214,228,0.95)';
    ctx.lineWidth = Math.max(1.5, size * 0.05);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 光泽高光（左上）：锐利亮斑 + 柔和反光
    ctx.save();
    heartPath(ctx, size);
    ctx.clip();
    var hl = ctx.createRadialGradient(-size * 5, -size * 6, 0, -size * 5, -size * 6, size * 4.5);
    hl.addColorStop(0, 'rgba(255,255,255,0.95)');
    hl.addColorStop(0.45, 'rgba(255,255,255,0.55)');
    hl.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hl;
    ctx.fillRect(-size * 20, -size * 20, size * 40, size * 40);
    var hl2 = ctx.createRadialGradient(-size * 2, -size * 4, 0, -size * 2, -size * 4, size * 12);
    hl2.addColorStop(0, 'rgba(255,255,255,0.22)');
    hl2.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hl2;
    ctx.fillRect(-size *20, -size * 20, size * 40, size * 40);
    ctx.restore();

    // 底部内阴影（立体深度）
    ctx.save();
    heartPath(ctx, size);
    ctx.clip();
    var sh = ctx.createRadialGradient(size * 3, size * 10, 0, size * 3, size * 10, size * 15);
    sh.addColorStop(0, 'rgba(110,8,40,0.55)');
    sh.addColorStop(1, 'rgba(110,8,40,0)');
    ctx.fillStyle = sh;
    ctx.fillRect(-size * 20, -size * 20, size * 40, size * 40);
    ctx.restore();

    ctx.restore();

    // 轮廓上闪烁的星点
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = alpha;
    for (var k = 0; k < 6; k++) {
      var tt = (k / 6) * Math.PI * 2 + Math.PI * 0.5;
      var sx = 16 * Math.pow(Math.sin(tt), 3);
      var sy = 13 * Math.cos(tt) - 5 * Math.cos(2*tt) - 2 * Math.cos(3*tt) - Math.cos(4*tt);
      var px = cx + sx * size;
      var py = cy - sy * size * 0.92;
      var tw = 0.5 + 0.5 * Math.sin(time * 0.006 + k * 2.4);
      var sr = size * (0.5 + tw * 0.6);
      var sg = ctx.createRadialGradient(px, py, 0, px, py, sr * 3);
      sg.addColorStop(0, 'rgba(255,255,255,' + (0.9 * tw) + ')');
      sg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = sg;
      ctx.fillRect(px - sr * 3, py - sr * 3, sr * 6, sr * 6);
    }
    ctx.restore();

    // 名字
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var fs = Math.min(W, H) * 0.11;
    ctx.font = '700 ' + fs + 'px "Noto Serif SC","Microsoft YaHei",serif';
    ctx.shadowColor = 'rgba(255,200,150,0.95)';
    ctx.shadowBlur = 18;
    ctx.fillStyle = '#fff8ee';
    ctx.fillText('戴雪静', cx, cy - size * 1.6);
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  // ---------- 玫瑰：层叠贝塞尔花瓣（精致矢量花束） ----------
  var rosePetals = [];

  function buildRose() {
    rosePetals = [];
    // 由外到内多层花瓣；越内越短、越暗、越紧凑，形成自然螺旋花心
    var layers = [
      { n: 10, base: 0.16, len: 0.88, wid: 0.44, Lb: 36, Lm: 50, Lt: 68 },
      { n:  9, base: 0.14, len: 0.76, wid: 0.42, Lb: 30, Lm: 43, Lt: 60 },
      { n:  8, base: 0.12, len: 0.64, wid: 0.38, Lb: 24, Lm: 36, Lt: 51 },
      { n:  7, base: 0.09, len: 0.52, wid: 0.33, Lb: 19, Lm: 29, Lt: 42 },
      { n:  6, base: 0.04, len: 0.40, wid: 0.27, Lb: 14, Lm: 22, Lt: 33 },
    ];
    for (var li = 0; li < layers.length; li++) {
      var L = layers[li];
      for (var i = 0; i < L.n; i++) {
        var ang = (i / L.n) * Math.PI * 2 + li * 0.5;
        // 每片花瓣加入随机的亮度 / 色相抖动，让花瓣有自然差异
        var jit = (Math.random() - 0.5) * 9;
        var hue = 345 + Math.random() * 8;
        rosePetals.push({
          ang: ang,
          base: L.base, len: L.len, wid: L.wid,
          cBase: 'hsl(' + hue + ', 90%, ' + Math.max(8, L.Lb + jit) + '%)',
          cMid:  'hsl(' + hue + ', 92%, ' + Math.max(12, L.Lm + jit) + '%)',
          cTip:  'hsl(' + hue + ', 94%, ' + Math.min(80, L.Lt + jit) + '%)',
        });
      }
    }
  }

  function rosePetalPath(pw, ph) {
    ctx.beginPath();
    ctx.moveTo(-pw, 0);
    ctx.bezierCurveTo(-pw * 1.45, -ph * 0.42, -pw * 0.88, -ph * 0.92, -pw * 0.18, -ph * 0.98);
    ctx.quadraticCurveTo(0, -ph * 0.87, pw * 0.18, -ph * 0.98);
    ctx.bezierCurveTo(pw * 0.88, -ph * 0.92, pw * 1.45, -ph * 0.42, pw, 0);
    ctx.closePath();
  }

  function drawRoseBloom(time, alpha, cx, cy, R) {
    var throb = 1 + Math.sin(time * 0.0011) * 0.025;
    var rot = time * 0.00022 + heartRotation;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    // 由外到内绘制（外层在底层）
    for (var i = 0; i < rosePetals.length; i++) {
      var p = rosePetals[i];
      var bx = Math.cos(p.ang) * p.base * R * throb;
      var by = Math.sin(p.ang) * p.base * R * throb;
      ctx.save();
      ctx.translate(bx, by);
      ctx.rotate(p.ang + Math.PI / 2);
      var pl = p.len * R * throb;
      var pw = p.wid * R * throb;
      rosePetalPath(pw, pl);
      var g = ctx.createLinearGradient(0, 0, 0, -pl);
      g.addColorStop(0, p.cBase);
      g.addColorStop(0.55, p.cMid);
      g.addColorStop(1, p.cTip);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.strokeStyle = 'rgba(96, 5, 30, 0.45)';
      ctx.lineWidth = Math.max(0.8, R * 0.016);
      ctx.stroke();
      // 花瓣尖端柔和高光（水润感）
      var tg = ctx.createRadialGradient(0, -pl * 0.72, 0, 0, -pl * 0.72, pl * 0.36);
      tg.addColorStop(0, 'rgba(255, 235, 242, 0.20)');
      tg.addColorStop(1, 'rgba(255, 235, 242, 0)');
      ctx.fillStyle = tg;
      ctx.fillRect(-pw, -pl, pw * 2, pl);
      ctx.restore();
    }
    // 花冠底部阴影（衔接花托，增加立体深度）
    var shd = ctx.createRadialGradient(0, R * 0.72, R * 0.15, 0, R * 0.72, R * 0.9);
    shd.addColorStop(0, 'rgba(72, 4, 24, 0.38)');
    shd.addColorStop(1, 'rgba(72, 4, 24, 0)');
    ctx.fillStyle = shd;
    ctx.fillRect(-R, -R, R * 2, R * 2);
    // 中心螺旋花苞
    ctx.strokeStyle = 'rgba(120, 8, 40, 0.85)';
    ctx.lineCap = 'round';
    for (var sp = 0; sp < 3; sp++) {
      ctx.lineWidth = Math.max(1, R * (0.022 - sp * 0.004));
      ctx.beginPath();
      for (var st = 0; st <= 20; st++) {
        var rr = R * (0.08 + st * 0.014);
        var aa = sp * 2.1 + st * 0.32;
        var pxx = Math.cos(aa) * rr;
        var pyy = Math.sin(aa) * rr;
        if (st === 0) ctx.moveTo(pxx, pyy); else ctx.lineTo(pxx, pyy);
      }
      ctx.stroke();
    }
    // 顶部柔和高光（整体光泽）
    var hl = ctx.createRadialGradient(-R * 0.18, -R * 0.32, 0, -R * 0.18, -R * 0.32, R * 0.6);
    hl.addColorStop(0, 'rgba(255, 228, 238, 0.30)');
    hl.addColorStop(1, 'rgba(255, 228, 238, 0)');
    ctx.fillStyle = hl;
    ctx.fillRect(-R, -R, R * 2, R * 2);
    ctx.restore();
  }

  function drawRoseScene(time, alpha) {
    var cx = W / 2;
    var cy = H * 0.40;
    var R = Math.min(W * 0.46, H * 0.25);

    // 柔光背景（additive）
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 1.9);
    bg.addColorStop(0, 'rgba(255, 110, 150, 0.20)');
    bg.addColorStop(1, 'rgba(255, 110, 150, 0)');
    ctx.fillStyle = bg;
    ctx.globalAlpha = alpha;
    ctx.fillRect(cx - R * 1.9, cy - R * 1.9, R * 3.8, R * 3.8);
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = alpha;

    // 花茎（一束，从花托向下收束）
    ctx.strokeStyle = 'rgba(40, 120, 68, 0.92)';
    ctx.lineCap = 'round';
    var stemTop = cy + R * 0.72;
    var stemBot = cy + R * 1.7;
    for (var i = 0; i < 6; i++) {
      var a = (i / 6) * Math.PI * 2 + 0.25;
      var sx = cx + Math.cos(a) * R * 0.42;
      ctx.lineWidth = R * 0.07;
      ctx.beginPath();
      ctx.moveTo(sx, stemTop);
      ctx.quadraticCurveTo(cx + Math.cos(a) * R * 0.16, (stemTop + stemBot) / 2, cx, stemBot);
      ctx.stroke();
    }

    // 花托（萼片）：花冠下方的绿色尖叶
    for (var se = 0; se < 5; se++) {
      var sa = -Math.PI / 2 + (se - 2) * 0.34;
      ctx.save();
      ctx.translate(cx + Math.cos(sa) * R * 0.10, cy + R * 0.68);
      ctx.rotate(sa);
      var sg = ctx.createLinearGradient(0, 0, 0, R * 0.5);
      sg.addColorStop(0, 'rgba(96, 180, 120, 0.95)');
      sg.addColorStop(1, 'rgba(38, 105, 66, 0.95)');
      ctx.fillStyle = sg;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(-R * 0.16, R * 0.24, 0, R * 0.5);
      ctx.quadraticCurveTo(R * 0.16, R * 0.24, 0, 0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // 金色包装纸（锥形，上宽下尖）
    var wrapTop = cy + R * 1.28;
    var wrapBot = cy + R * 2.15;
    var wrap = ctx.createLinearGradient(cx - R, 0, cx + R, 0);
    wrap.addColorStop(0, 'rgba(226, 172, 112, 0.66)');
    wrap.addColorStop(1, 'rgba(170, 120, 70, 0.66)');
    ctx.fillStyle = wrap;
    ctx.beginPath();
    ctx.moveTo(cx, wrapBot);
    ctx.quadraticCurveTo(cx - R * 0.68, wrapTop + R * 0.1, cx - R * 0.95, wrapTop);
    ctx.lineTo(cx - R * 0.40, wrapTop + R * 0.05);
    ctx.lineTo(cx + R * 0.40, wrapTop + R * 0.05);
    ctx.lineTo(cx + R * 0.95, wrapTop);
    ctx.quadraticCurveTo(cx + R * 0.68, wrapTop + R * 0.1, cx, wrapBot);
    ctx.closePath();
    ctx.fill();

    // 蝴蝶结
    var bowY = cy + R * 1.5;
    ctx.fillStyle = 'rgba(255, 190, 110, 0.95)';
    ctx.beginPath();
    ctx.arc(cx - R * 0.16, bowY, R * 0.12, 0, Math.PI * 2);
    ctx.arc(cx + R * 0.16, bowY, R * 0.12, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    // 花冠（最上层）
    drawRoseBloom(time, alpha, cx, cy, R);
  }

  // ---------- Animation loop ----------
  var lastTime = performance.now();
  function loop(now) {
    var time = now || performance.now();
    var dt = Math.min(50, time - lastTime);
    lastTime = time;

    // trail fade (soft motion blur) instead of a hard clear
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(5, 5, 16, 0.16)';
    ctx.fillRect(0, 0, W, H);

    // drifting aurora background
    drawAurora(time);

    // composite: additive glow
    ctx.globalCompositeOperation = 'lighter';

    // smooth intensities
    starIntensity += (targetStarIntensity - starIntensity) * 0.03;
    bridgeIntensity += (targetBridgeIntensity - bridgeIntensity) * 0.03;

    // --- current scene flags + heartbeat ---
    var isHeartScene = scenes[sceneIdx].type === 'heart';
    var isRoseScene = scenes[sceneIdx].type === 'rose';
    if (isHeartScene) heartPulse = heartbeat(time);

    // --- morph particles ---
    for (var i = 0; i < morphParticles.length; i++) {
      var p = morphParticles[i];
      // ease to target
      p.x += (p.tx - p.x) * 0.045;
      p.y += (p.ty - p.y) * 0.045;
      // breathing wobble
      p.x += Math.sin(time * 0.001 + p.phase) * wobbleAmp;
      p.y += Math.cos(time * 0.0011 + p.phase) * wobbleAmp;
      // twinkle
      var a = p.baseAlpha * p.depthAlpha * (0.55 + 0.45 * Math.sin(time * p.twinkle + p.phase));
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.depthScale, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // --- bridge particles ---
    if (bridgeIntensity > 0.02) {
      for (var b = 0; b < bridgeParticles.length; b++) {
        var bp = bridgeParticles[b];
        bp.t += bp.speed * (dt / 16.7);
        if (bp.t > 1) bp.t -= 1;
        var pos = bridgePoint(bp.t);
        bp.x = pos.x; bp.y = pos.y;
        var mid = Math.sin(bp.t * Math.PI); // 中间亮、两端淡
        ctx.globalAlpha = bridgeIntensity * (0.35 + 0.65 * mid);
        ctx.fillStyle = bp.color;
        ctx.beginPath();
        ctx.arc(bp.x, bp.y, bp.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // --- two stars ---
    drawStar(star1.x, star1.y, starIntensity, '#ffd7a8');
    drawStar(star2.x, star2.y, starIntensity, '#ffd7a8');

    // --- heartbeat glow (pulses during the heart scene) ---
    if (scenes[sceneIdx].type === 'heart') {
      var hr = Math.min(W, H) * 0.5;
      var hg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, hr);
      hg.addColorStop(0, 'rgba(255,120,165,' + (0.18 * heartPulse + 0.03) + ')');
      hg.addColorStop(1, 'rgba(255,120,165,0)');
      ctx.fillStyle = hg;
      ctx.fillRect(W/2 - hr, H/2 - hr, hr * 2, hr * 2);
    }

    // --- sparks ---
    for (var s = sparks.length - 1; s >= 0; s--) {
      var sp = sparks[s];
      sp.x += sp.vx;
      sp.y += sp.vy;
      sp.vy += 0.015;
      sp.vx *= 0.99;
      sp.vy *= 0.99;
      sp.life -= sp.decay;
      if (sp.life <= 0) { sparks.splice(s, 1); continue; }
      ctx.globalAlpha = sp.life;
      ctx.fillStyle = sp.color;
      ctx.beginPath();
      ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // --- shooting stars ---
    for (var sh = shootingStars.length - 1; sh >= 0; sh--) {
      var sst = shootingStars[sh];
      sst.x += sst.vx;
      sst.y += sst.vy;
      sst.life -= sst.decay;
      if (sst.life <= 0 || sst.x < -60 || sst.x > W + 60 || sst.y > H + 60) {
        shootingStars.splice(sh, 1); continue;
      }
      var tailX = sst.x - sst.vx * sst.len * 0.11;
      var tailY = sst.y - sst.vy * sst.len * 0.11;
      var sg = ctx.createLinearGradient(sst.x, sst.y, tailX, tailY);
      sg.addColorStop(0, 'rgba(255,255,255,' + (0.95 * sst.life) + ')');
      sg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = sg;
      ctx.lineWidth = 1.7;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(sst.x, sst.y);
      ctx.lineTo(tailX, tailY);
      ctx.stroke();
    }

    // --- fireworks ---
    for (var f = fireworks.length - 1; f >= 0; f--) {
      var fw = fireworks[f];
      var alive = false;
      for (var fp = fw.parts.length - 1; fp >= 0; fp--) {
        var fpp = fw.parts[fp];
        fpp.x += fpp.vx;
        fpp.y += fpp.vy;
        fpp.vy += 0.02;
        fpp.vx *= 0.985;
        fpp.vy *= 0.985;
        fpp.life -= fpp.decay;
        if (fpp.life <= 0) { fw.parts.splice(fp, 1); continue; }
        alive = true;
        ctx.globalAlpha = fpp.life;
        ctx.fillStyle = 'hsla(' + fpp.hue + ', 92%, 70%, 1)';
        ctx.beginPath();
        ctx.arc(fpp.x, fpp.y, 1.6, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      if (!alive) fireworks.splice(f, 1);
    }

    ctx.globalCompositeOperation = 'source-over';

    // --- falling rose petals ---
    for (var pt = petals.length - 1; pt >= 0; pt--) {
      var petal = petals[pt];
      petal.sway += 0.02;
      petal.y += petal.vy;
      petal.x += petal.vx + Math.sin(petal.sway) * 0.4;
      petal.rot += petal.rotSpeed;
      if (petal.y > H + 30) { petals.splice(pt, 1); continue; }
      ctx.save();
      ctx.translate(petal.x, petal.y);
      ctx.rotate(petal.rot);
      ctx.globalAlpha = petal.alpha;
      ctx.fillStyle = petal.color;
      ctx.beginPath();
      ctx.ellipse(0, 0, petal.size, petal.size * 0.58, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // --- floating hearts (tap) ---
    for (var fh = floatHearts.length - 1; fh >= 0; fh--) {
      var fheart = floatHearts[fh];
      fheart.x += fheart.vx;
      fheart.y += fheart.vy;
      fheart.vy += 0.008;
      fheart.vx *= 0.995;
      fheart.rot += fheart.rotSpeed;
      fheart.life -= fheart.decay;
      if (fheart.life <= 0 || fheart.y < -60) { floatHearts.splice(fh, 1); continue; }
      ctx.save();
      ctx.translate(fheart.x, fheart.y);
      ctx.rotate(fheart.rot);
      ctx.globalAlpha = fheart.life;
      ctx.fillStyle = fheart.color;
      var s = fheart.size;
      ctx.beginPath();
      ctx.moveTo(0, s * 0.9);
      ctx.bezierCurveTo(-s * 1.2, s * 0.1, -s * 0.9, -s * 0.9, 0, -s * 0.3);
      ctx.bezierCurveTo(s * 0.9, -s * 0.9, s * 1.2, s * 0.1, 0, s * 0.9);
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    // --- scene overlay (heart / rose) ---
    if (isHeartScene || isRoseScene) targetSceneAlpha = 1; else targetSceneAlpha = 0;
    sceneAlpha += (targetSceneAlpha - sceneAlpha) * 0.09;
    if (sceneAlpha > 0.01) {
      if (isHeartScene) drawVectorHeart(time, sceneAlpha);
      else if (isRoseScene) drawRoseScene(time, sceneAlpha);
    }

    requestAnimationFrame(loop);
  }

  function drawStar(x, y, intensity, color) {
    if (intensity < 0.02) return;
    var r = isMobile ? 3 : 4.5;
    var g = ctx.createRadialGradient(x, y, 0, x, y, r * 7);
    g.addColorStop(0, 'rgba(255,215,168,' + (0.9 * intensity) + ')');
    g.addColorStop(0.3, 'rgba(255,215,168,' + (0.35 * intensity) + ')');
    g.addColorStop(1, 'rgba(255,215,168,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - r*7, y - r*7, r*14, r*14);

    ctx.fillStyle = color;
    ctx.globalAlpha = intensity;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();

    // 四芒星光
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.85 * intensity) + ')';
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(x - r*3.2, y); ctx.lineTo(x + r*3.2, y);
    ctx.moveTo(x, y - r*3.2); ctx.lineTo(x, y + r*3.2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // ---------- Init ----------
  function init() {
    resize();
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, W, H);
    for (var i = 0; i < MORPH_COUNT; i++) morphParticles.push(makeMorphParticle());
    for (var j = 0; j < BRIDGE_COUNT; j++) bridgeParticles.push(makeBridgeParticle());
    buildRose();
    applyScene(scenes[0]);

    // 标题常驻
    setTimeout(function() { titleEl.classList.add('show'); }, 400);

    scheduleNext();
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', function() {
    resize();
  });

  // 等字体加载后清缓存，保证中文字形采样准确
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function() { textCache = {}; });
  }

  init();
})();
</script>
</body>
</html>
