<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>七夕 · 致戴雪静</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;500&family=Dancing+Script:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0a0614;
    --bg-1:#1a0e2e;
    --bg-2:#2c1136;
    --gold:#ffd9a8;
    --gold-soft:#ffe9cf;
    --pink:#ff7a9e;
    --pink-deep:#e0115f;
    --crimson:#8a0f3e;
    --text-glow: rgba(255,122,158,.55);
  }

  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    width:100%; height:100%;
    overflow:hidden;
    background:var(--bg-0);
    font-family:'Noto Serif SC', serif;
    color:#fff;
    user-select:none;
  }

  /* 深邃夜空渐变背景 */
  body::before{
    content:"";
    position:fixed; inset:0;
    background:
      radial-gradient(120% 80% at 50% -10%, #3b1a4a 0%, transparent 55%),
      radial-gradient(90% 60% at 50% 115%, #4a1230 0%, transparent 55%),
      linear-gradient(160deg, var(--bg-0) 0%, var(--bg-1) 45%, var(--bg-2) 100%);
    z-index:0;
  }

  #fx{ position:fixed; inset:0; z-index:1; pointer-events:none; }

  #stage{ position:fixed; inset:0; z-index:2; pointer-events:none; }

  .scene{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:18px; text-align:center;
    padding:0 28px;
    opacity:0;
    transition:opacity 1.4s ease;
    will-change:opacity;
  }
  .scene.active{ opacity:1; }

  /* ---------- 文字 ---------- */
  .zh{
    font-family:'Ma Shan Zheng', cursive;
    background:linear-gradient(180deg, #fff6e8 0%, #ffd9a8 40%, #ff9db5 100%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
    filter:drop-shadow(0 0 26px rgba(255,180,160,.35));
    letter-spacing:.08em;
  }

  .title-zh{ font-size:clamp(88px, 30vw, 148px); line-height:1.05; animation:floatY 5s ease-in-out infinite; }
  .name{ font-size:clamp(64px, 22vw, 110px); line-height:1.1; animation:floatY 5.5s ease-in-out infinite; }
  .name.small{ font-size:clamp(40px, 13vw, 64px); animation:none; }
  .msg{ font-size:clamp(64px, 22vw, 104px); line-height:1.15; animation:floatY 5s ease-in-out infinite; }

  .subtitle{
    font-size:clamp(18px, 5vw, 24px);
    letter-spacing:.42em; text-indent:.42em;
    color:var(--gold-soft);
    opacity:.92;
  }

  .en{
    font-family:'Dancing Script', cursive;
    font-size:clamp(18px, 5.4vw, 26px);
    color:#ffd9c9;
    opacity:.78;
    letter-spacing:.04em;
  }

  .caption{
    font-size:clamp(15px, 4.4vw, 19px);
    letter-spacing:.18em;
    color:#ffdce8;
    opacity:.85;
  }

  .glow{
    text-shadow:
      0 0 8px var(--text-glow),
      0 0 24px var(--text-glow),
      0 0 48px rgba(255,77,109,.35);
  }

  /* ---------- 爱心 ---------- */
  .heart{
    width:min(74vw, 300px);
    height:min(70.3vw, 285px);
    filter:drop-shadow(0 0 18px rgba(255,77,109,.5)) drop-shadow(0 0 46px rgba(224,17,95,.35));
    animation:beat 1.35s ease-in-out infinite;
    transform-origin:50% 42%;
  }
  .heart .gloss{ animation:shine 3.2s ease-in-out infinite; }

  /* ---------- 玫瑰 ---------- */
  .rose{
    width:min(80vw, 320px);
    height:min(80vw, 320px);
    filter:drop-shadow(0 0 20px rgba(255,77,109,.5)) drop-shadow(0 0 50px rgba(224,17,95,.3));
    animation:bloom 1.6s cubic-bezier(.2,.8,.2,1) both, sway 12s ease-in-out 1.6s infinite;
    transform-origin:50% 85%;
  }

  /* ---------- 动画 ---------- */
  @keyframes floatY{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-12px); }
  }
  @keyframes beat{
    0%,100%{ transform:scale(1); }
    12%{ transform:scale(1.075); }
    24%{ transform:scale(1); }
    36%{ transform:scale(1.05); }
    48%{ transform:scale(1); }
  }
  @keyframes shine{
    0%,100%{ opacity:.55; }
    50%{ opacity:1; }
  }
  @keyframes bloom{
    from{ opacity:0; transform:scale(.55) rotate(-6deg); }
    to{ opacity:1; transform:scale(1) rotate(0deg); }
  }
  @keyframes sway{
    0%,100%{ transform:rotate(-2.2deg); }
    50%{ transform:rotate(2.2deg); }
  }
</style>
</head>
<body>
  <canvas id="fx"></canvas>

  <div id="stage">

    <section class="scene" id="s-title">
      <div class="zh title-zh">七夕</div>
      <div class="subtitle">致 · 戴雪静</div>
      <div class="en">for my love</div>
    </section>

    <section class="scene" id="s-name">
      <div class="zh name glow">戴雪静</div>
      <div class="en">my beloved</div>
    </section>

    <section class="scene" id="s-i1">
      <div class="zh msg glow">我爱你</div>
      <div class="en">I love you</div>
    </section>

    <section class="scene" id="s-i2">
      <div class="zh msg glow">七夕快乐</div>
      <div class="en">Happy Qixi Festival</div>
    </section>

    <section class="scene" id="s-i3">
      <div class="zh msg glow">爱你永远</div>
      <div class="en">Forever &amp; always</div>
    </section>

    <section class="scene" id="s-heart">
      <div class="zh name small">戴雪静</div>
      <svg class="heart" viewBox="0 0 200 190" aria-hidden="true">
        <defs>
          <radialGradient id="hg" cx="50%" cy="36%" r="70%">
            <stop offset="0%"  stop-color="#ffa8c2"/>
            <stop offset="42%" stop-color="#ff4d6d"/>
            <stop offset="72%" stop-color="#e0115f"/>
            <stop offset="100%" stop-color="#7a0c38"/>
          </radialGradient>
          <radialGradient id="hl" cx="38%" cy="22%" r="38%">
            <stop offset="0%"  stop-color="#ffffff" stop-opacity=".95"/>
            <stop offset="60%" stop-color="#ffffff" stop-opacity=".18"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <path d="M100 178
                 C 42 130 10 96 10 55
                 C 10 25 33 8 58 8
                 C 77 8 92 18 100 34
                 C 108 18 123 8 142 8
                 C 167 8 190 25 190 55
                 C 190 96 158 130 100 178 Z"
              fill="url(#hg)"/>
        <path class="gloss" d="M100 178
                 C 42 130 10 96 10 55
                 C 10 25 33 8 58 8
                 C 77 8 92 18 100 34
                 C 108 18 123 8 142 8
                 C 167 8 190 25 190 55
                 C 190 96 158 130 100 178 Z"
              fill="url(#hl)"/>
      </svg>
      <div class="caption">我的心，为你而跳</div>
    </section>

    <section class="scene" id="s-rose">
      <svg class="rose" viewBox="0 0 200 200" id="rose-svg" aria-hidden="true"></svg>
      <div class="caption">爱你永远</div>
    </section>

  </div>

<script>
(function(){
  'use strict';

  /* ============ 背景光效画布 ============ */
  var cvs = document.getElementById('fx');
  var ctx = cvs.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cvs.width = W * DPR; cvs.height = H * DPR;
    cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  function rgba(hex, a){
    var n = parseInt(hex.slice(1), 16);
    return 'rgba(' + ((n>>16)&255) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')';
  }

  var sprites = {};
  function glow(hex){
    if (sprites[hex]) return sprites[hex];
    var s = document.createElement('canvas'); s.width = s.height = 64;
    var g = s.getContext('2d');
    var gr = g.createRadialGradient(32,32,0,32,32,32);
    gr.addColorStop(0, rgba(hex,1));
    gr.addColorStop(0.28, rgba(hex,.55));
    gr.addColorStop(1, rgba(hex,0));
    g.fillStyle = gr; g.fillRect(0,0,64,64);
    return sprites[hex] = s;
  }

  // 星星（闪烁）
  var stars = [];
  var STAR_COUNT = 70;
  for (var i = 0; i < STAR_COUNT; i++){
    stars.push({
      x: Math.random(), y: Math.random() * 0.85,
      r: 0.6 + Math.random() * 1.3,
      ph: Math.random() * Math.PI * 2,
      sp: 0.6 + Math.random() * 1.6
    });
  }

  // 萤火虫般漂浮的光点
  var fireflies = [];
  var FF_COUNT = 26;
  for (var j = 0; j < FF_COUNT; j++){
    fireflies.push({
      x: Math.random(), y: 0.3 + Math.random() * 0.8,
      vy: 0.004 + Math.random() * 0.010,
      sway: 0.5 + Math.random(),
      ph: Math.random() * Math.PI * 2,
      size: 7 + Math.random() * 12,
      color: Math.random() < 0.7 ? '#ffc9a8' : '#ff9db5'
    });
  }

  function drawFx(t){
    ctx.clearRect(0, 0, W, H);
    var ms = t / 1000;

    // 星星
    for (var i = 0; i < stars.length; i++){
      var s = stars[i];
      var a = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(ms * s.sp + s.ph));
      ctx.globalAlpha = a;
      ctx.fillStyle = '#fff3e0';
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // 萤火光点（additive 柔和发光）
    ctx.globalCompositeOperation = 'lighter';
    for (var k = 0; k < fireflies.length; k++){
      var f = fireflies[k];
      f.y -= f.vy;
      if (f.y < -0.08){ f.y = 1.08; f.x = Math.random(); }
      var fx = (f.x * W) + Math.sin(ms * f.sway + f.ph) * 22;
      var fy = f.y * H;
      var tw = 0.5 + 0.5 * Math.sin(ms * 1.4 + f.ph * 2);
      var spr = glow(f.color);
      var d = f.size * (2.6 + tw * 1.2);
      ctx.globalAlpha = 0.20 + 0.30 * tw;
      ctx.drawImage(spr, fx - d/2, fy - d/2, d, d);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ============ 玫瑰（SVG 生成） ============ */
  function buildRose(){
    var svg = document.getElementById('rose-svg');
    var layers = [
      { n:10, r:3,  size:46, tint:['#ff86a8','#ff6f96'] },
      { n:8,  r:2,  size:40, tint:['#ff5c87','#f4447a'] },
      { n:6,  r:2,  size:34, tint:['#ef3a72','#e02a63'] },
      { n:5,  r:2,  size:28, tint:['#d51f5a','#c0184f'] },
      { n:4,  r:2,  size:20, tint:['#a80f42','#8a0c38'] }
    ];
    var defs = '';
    var body = '';
    var gid = 0;

    layers.forEach(function(L, li){
      var step = 360 / L.n;
      var off = li * 15;
      for (var i = 0; i < L.n; i++){
        var ang = i * step + off;
        var w = L.size * 0.70;
        var gr = 'petal' + (gid++);
        defs += '<linearGradient id="' + gr + '" x1="0" y1="0" x2="0" y2="1">'
             +  '<stop offset="0" stop-color="' + L.tint[0] + '"/>'
             +  '<stop offset="1" stop-color="' + L.tint[1] + '"/>'
             +  '</linearGradient>';
        body += '<path class="petal" d="M0 0 C -' + w.toFixed(1) + ' ' + (-L.size*0.16).toFixed(1)
             +  ' -' + w.toFixed(1) + ' ' + (-L.size*0.62).toFixed(1)
             +  ' 0 ' + (-L.size).toFixed(1)
             +  ' C ' + w.toFixed(1) + ' ' + (-L.size*0.62).toFixed(1)
             +  ' ' + w.toFixed(1) + ' ' + (-L.size*0.16).toFixed(1)
             +  ' 0 0 Z" fill="url(#' + gr + ')" '
             +  'transform="translate(100 100) rotate(' + ang + ') translate(0 ' + (-L.r) + ')" '
             +  'style="animation-delay:' + (li*140 + i*60) + 'ms"/>';
      }
    });

    // 中心螺旋花心
    var spiral = '';
    for (var s = 0; s < 16; s++){
      var a = s * 0.62;
      var rr = 1.2 + s * 0.55;
      var xx = 100 + Math.cos(a) * rr;
      var yy = 100 + Math.sin(a) * rr;
      var sw = 8 - s * 0.3;
      spiral += '<path d="M0 0 C -' + sw.toFixed(1) + ' -' + (sw*0.4).toFixed(1)
             +  ' -' + sw.toFixed(1) + ' -' + (sw*1.5).toFixed(1)
             +  ' 0 -' + (sw*1.9).toFixed(1)
             +  ' C ' + sw.toFixed(1) + ' -' + (sw*1.5).toFixed(1)
             +  ' ' + sw.toFixed(1) + ' -' + (sw*0.4).toFixed(1)
             +  ' 0 0 Z" fill="#5c0626" '
             +  'transform="translate(' + xx.toFixed(1) + ' ' + yy.toFixed(1) + ') rotate(' + (s*38) + ')" '
             +  'style="animation-delay:' + (720 + s*50) + 'ms"/>';
    }

    svg.innerHTML = '<defs>' + defs + '</defs>' + body + spiral;
  }
  buildRose();

  /* ============ 场景时间轴（setTimeout 精确调度，循环播放） ============ */
  var scenes = [
    { id:'s-title', at:0      },
    { id:'s-name',  at:4200   },
    { id:'s-i1',    at:9000   },
    { id:'s-i2',    at:13800  },
    { id:'s-i3',    at:18600  },
    { id:'s-heart', at:23400  },
    { id:'s-rose',  at:31800  }
  ];
  var TOTAL = 40000;          // 一轮总时长（毫秒），循环播放

  var stageEls = {};
  document.querySelectorAll('.scene').forEach(function(el){
    stageEls[el.id] = el;
  });

  function showScene(id){
    for (var key in stageEls){
      stageEls[key].classList.toggle('active', key === id);
    }
  }

  function scheduleCycle(){
    for (var i = 0; i < scenes.length; i++){
      (function(s){
        setTimeout(function(){ showScene(s.id); }, s.at);
      })(scenes[i]);
    }
  }

  // URL hash 强制显示某个场景（调试用）：如 qixi.html#s-heart
  var forced = location.hash.slice(1);
  var found = false;
  for (var i = 0; i < scenes.length; i++){
    if (scenes[i].id === forced){ showScene(forced); found = true; break; }
  }
  if (!found){
    scheduleCycle();
    setInterval(scheduleCycle, TOTAL);
  }

  /* ============ 画布主循环（累计帧时间，不依赖时间戳基准） ============ */
  var animTime = 0;
  var lastNow = null;
  function tick(now){
    if (lastNow === null) lastNow = now;
    if (now >= lastNow) animTime += now - lastNow;
    lastNow = now;
    drawFx(animTime);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
